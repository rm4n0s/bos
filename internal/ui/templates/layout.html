{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Bowl of Scenes</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/datastar.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Bowl of Scenes</a>
  {{template "nav" .}}
  {{if .SignedIn}}<form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>{{end}}
</header>
<div id="toasts" class="toasts"></div>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
