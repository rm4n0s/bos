{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Bowl of Scenes</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/datastar.js"></script>
<script src="/static/complete.js" defer></script>
<script src="/static/loras.js" defer></script>
<script src="/static/viewer.js" defer></script>
<script src="/static/localtime.js" defer></script>
</head>
<body{{if not .NoStream}} data-init="@get('/ui/stream/toasts', {retry: 'always', retryMaxCount: 1000000, openWhenHidden: true})"{{end}}>
<header class="top">
  <a class="brand" href="/">Bowl of Scenes</a>
  {{template "nav" .}}
  {{if .SignedIn}}<form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>{{end}}
</header>
<div id="toasts" class="toasts"></div>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
